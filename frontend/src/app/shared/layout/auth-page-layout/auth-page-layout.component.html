<div class="relative p-6 bg-white z-1 dark:bg-gray-900 sm:p-0">
  <div class="relative flex flex-col justify-center w-full h-screen lg:flex-row dark:bg-gray-900 sm:p-0">

    <ng-content></ng-content>

    <!-- Partie droite -->
    <div class="items-center hidden w-full h-full lg:w-1/2 bg-brand-950 dark:bg-white/5 lg:grid relative overflow-hidden">

      <!-- Grille décorative originale conservée -->
      <div class="flex items-center justify-center z-1">
        <app-grid-shape />

        <div class="flex flex-col items-center max-w-xs text-center px-6">

          <!-- Logo MedTrack -->
          <div class="w-16 h-16 rounded-2xl bg-brand-500 flex items-center justify-center mb-6">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L4 6v6c0 4.5 3.5 8.7 8 10 4.5-1.3 8-5.5 8-10V6l-8-4z"
                    stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </div>

          <!-- Nom -->
          <h2 class="text-2xl font-bold text-white mb-2">
            MedTrack <span class="text-brand-400">Cloud</span>
          </h2>

          <!-- Description -->
          <p class="text-gray-400 dark:text-white/60 text-sm leading-relaxed">
            Plateforme sécurisée de gestion du cycle de vie des dispositifs médicaux importés
          </p>

          <!-- Stats -->
          <div class="grid grid-cols-3 gap-3 mt-8 w-full">
            <div class="bg-white/5 rounded-xl p-3">
              <p class="text-white font-bold text-base">100%</p>
              <p class="text-gray-500 text-xs mt-0.5">Sécurisé</p>
            </div>
            <div class="bg-white/5 rounded-xl p-3">
              <p class="text-white font-bold text-base">24/7</p>
              <p class="text-gray-500 text-xs mt-0.5">Disponible</p>
            </div>
            <div class="bg-white/5 rounded-xl p-3">
              <p class="text-white font-bold text-base">Cloud</p>
              <p class="text-gray-500 text-xs mt-0.5">Natif</p>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Toggle thème conservé -->
    <div class="fixed z-50 hidden bottom-6 right-6 sm:block">
      <app-theme-toggle-two />
    </div>

  </div>
</div>
