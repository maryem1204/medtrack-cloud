@if (visible) {
  <button (click)="toggle()"
    class="fixed bottom-6 right-6 z-[60] w-14 h-14 rounded-full bg-gradient-to-br from-teal-500 to-blue-500 shadow-xl shadow-teal-500/40 flex items-center justify-center hover:scale-105 active:scale-95 transition-transform">
    @if (!ouvert) {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    }
  </button>

  @if (ouvert) {
    <div class="fixed bottom-24 right-6 z-[60] w-[380px] max-w-[90vw]">
      <app-chatbot></app-chatbot>
    </div>
  }
}
