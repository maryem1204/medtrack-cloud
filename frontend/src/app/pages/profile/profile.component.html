<div class="max-w-2xl mx-auto">
  <div class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-6">Mon profil</h3>

    @if (loading) {
      <p class="text-gray-500 dark:text-gray-400">Chargement...</p>
    } @else if (utilisateur) {
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-sm text-gray-600 dark:text-gray-400">Nom</label>
            <input [(ngModel)]="utilisateur.nom" type="text"
              class="mt-1 h-11 w-full rounded-lg border border-gray-200 bg-transparent px-3 text-sm dark:border-gray-800 dark:text-white/90" />
          </div>
          <div>
            <label class="text-sm text-gray-600 dark:text-gray-400">Prénom</label>
            <input [(ngModel)]="utilisateur.prenom" type="text"
              class="mt-1 h-11 w-full rounded-lg border border-gray-200 bg-transparent px-3 text-sm dark:border-gray-800 dark:text-white/90" />
          </div>
        </div>
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-400">Email</label>
          <input [(ngModel)]="utilisateur.email" type="email"
            class="mt-1 h-11 w-full rounded-lg border border-gray-200 bg-transparent px-3 text-sm dark:border-gray-800 dark:text-white/90" />
        </div>
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-400">Téléphone</label>
          <input [(ngModel)]="utilisateur.telephone" type="text"
            class="mt-1 h-11 w-full rounded-lg border border-gray-200 bg-transparent px-3 text-sm dark:border-gray-800 dark:text-white/90" />
        </div>
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-400">Rôle</label>
          <input [value]="utilisateur.role" type="text" readonly
            class="mt-1 h-11 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 text-sm text-gray-500 cursor-not-allowed dark:border-gray-800 dark:bg-gray-800 dark:text-gray-400" />
        </div>

        @if (message) { <p class="text-sm text-green-600 dark:text-green-400">{{ message }}</p> }
        @if (erreur) { <p class="text-sm text-red-600 dark:text-red-400">{{ erreur }}</p> }

        <button (click)="enregistrer()" class="h-11 px-6 rounded-lg bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium transition-colors">
          Enregistrer les modifications
        </button>
      </div>
    }
  </div>
</div>
