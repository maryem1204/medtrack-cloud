<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-950 p-4">
  <div class="w-full max-w-md">
    <div class="flex items-center justify-center gap-2 mb-8">
      <div class="w-9 h-9 rounded-lg bg-brand-500 flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 4.5 3.5 8.7 8 10 4.5-1.3 8-5.5 8-10V6l-8-4z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <span class="text-lg font-bold text-gray-800 dark:text-white/90">MedTrack <span class="text-brand-500">Cloud</span></span>
    </div>

    <div class="rounded-2xl border border-gray-200 bg-white p-8 dark:border-gray-800 dark:bg-white/[0.03]">
      @if (succes) {
        <div class="text-center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" class="mx-auto mb-3">
            <path d="M4 4h16v16H4V4z" stroke="#0d8f9e" stroke-width="1.6"/>
            <path d="M4 6l8 7 8-7" stroke="#0d8f9e" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <p class="text-gray-700 dark:text-gray-300 font-medium">Email envoyé !</p>
          <p class="text-sm text-gray-400 mt-1">Vérifie ta boîte de réception (et les spams).</p>
          <a routerLink="/signin" class="mt-4 inline-block text-sm text-brand-600 dark:text-brand-400 hover:underline">Retour à la connexion</a>
        </div>
      } @else {
        <h1 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-1">Mot de passe oublié</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Entre ton email, on t'envoie un lien de réinitialisation.</p>

        <div class="space-y-4">
          <div>
            <label class="text-sm text-gray-600 dark:text-gray-400">Email</label>
            <input [(ngModel)]="email" type="email" placeholder="ton.email@medtrack.com"
              class="mt-1 h-11 w-full rounded-lg border border-gray-200 bg-transparent px-3 text-sm dark:border-gray-800 dark:text-white/90" />
          </div>

          <!-- ✅ Case à cocher reCAPTCHA v2 -->
          <div class="flex justify-center">
            <div class="flex justify-center">
              <div id="recaptcha-container"></div>
            </div>
          </div>

          @if (erreur) {
            <p class="text-sm text-red-600 dark:text-red-400">{{ erreur }}</p>
          }

          <button (click)="envoyer()" [disabled]="envoiEnCours || !captchaValide"
            class="w-full h-11 rounded-lg bg-brand-500 hover:bg-brand-600 disabled:opacity-50 text-white text-sm font-medium transition-colors">
            {{ envoiEnCours ? 'Envoi...' : 'Envoyer le lien' }}
          </button>

          <a routerLink="/signin" class="block text-center text-sm text-brand-600 dark:text-brand-400 hover:underline">Retour à la connexion</a>
        </div>
      }
    </div>
  </div>
</div>
