apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: medtrack
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpass
  MYSQL_DATABASE: medtrack
  MYSQL_USER: medtrack
  MYSQL_PASSWORD: medtrackpass
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: medtrack
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: medtrack
spec:
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          envFrom:
            - secretRef: { name: mysql-secret }
          ports: [{ containerPort: 3306 }]
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim: { claimName: mysql-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: medtrack
spec:
  selector: { app: mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
