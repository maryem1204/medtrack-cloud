apiVersion: apps/v1
kind: Deployment
metadata:
  name: medtrack-frontend
  namespace: medtrack
spec:
  replicas: 2
  selector:
    matchLabels: { app: medtrack-frontend }
  template:
    metadata:
      labels: { app: medtrack-frontend }
    spec:
      containers:
        - name: frontend
          image: mirouu/medtrack-frontend:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: medtrack-frontend
  namespace: medtrack
spec:
  type: NodePort
  selector: { app: medtrack-frontend }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
